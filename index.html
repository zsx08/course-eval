<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无穹书院 · 课程评价系统</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== 登录 / 注册视图 ========== -->
  <div id="view-auth" class="view">
    <div class="auth-card">
      <div class="auth-logo">📚</div>
      <h1>无穹书院课程评价系统</h1>
      <p class="auth-subtitle">为学弟学妹照亮选课之路 ✨</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-auth-tab="login">登录</button>
        <button class="auth-tab" data-auth-tab="register">注册</button>
      </div>

      <form id="form-login" class="auth-form" autocomplete="off">
        <input type="text" id="login-id" placeholder="学号" required />
        <input type="password" id="login-pwd" placeholder="密码" required />
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
      </form>

      <form id="form-register" class="auth-form" autocomplete="off" hidden>
        <input type="text" id="reg-id" placeholder="学号" required />
        <input type="password" id="reg-pwd" placeholder="设置密码（至少 4 位）" minlength="4" required />
        <input type="password" id="reg-pwd2" placeholder="确认密码" minlength="4" required />
        <button type="submit" class="btn btn-primary btn-block">注 册 并 登 录</button>
      </form>

      <p id="auth-msg" class="msg"></p>
    </div>
  </div>

  <!-- ========== 主应用视图 ========== -->
  <div id="view-app" class="view" hidden>
    <header class="app-header">
      <div class="header-left">
        <span class="header-logo">📚</span>
        <span class="header-title">无穹书院课程评价系统</span>
      </div>
      <div class="header-right">
        <span id="header-user" class="header-user"></span>
        <button id="btn-logout" class="btn btn-ghost">退出</button>
      </div>
    </header>

    <!-- 学期 + 课程列表页 -->
    <main id="page-semester" class="page">
      <div class="semester-tabs" id="semester-tabs"></div>
      <div class="page-head-row">
        <h3>📚 课程列表</h3>
        <span class="section-sub">点击课程查看老师评价，同学也可自行添加课程</span>
        <button id="btn-add-course" class="btn btn-accent">＋ 添加课程</button>
      </div>
      <div id="course-grid" class="course-grid"></div>
    </main>

    <!-- 导员列表页（与春秋夏并列的第四个标签） -->
    <main id="page-counselors" class="page" hidden>
      <div class="page-head-row">
        <h3>🎓 导员评价</h3>
        <span class="section-sub">导员由同学们自行添加，可评分、留言、上传图片</span>
        <button id="btn-add-counselor" class="btn btn-accent">＋ 添加导员</button>
      </div>
      <div id="counselor-grid" class="course-grid"></div>
    </main>

    <!-- 课程详情页 -->
    <main id="page-course" class="page" hidden>
      <button id="btn-back" class="btn btn-ghost back-btn">← 返回学期</button>
      <div class="course-head">
        <h2 id="course-title"></h2>
        <p id="course-meta" class="course-meta"></p>
        <button id="btn-add-teacher" class="btn btn-accent">＋ 添加老师</button>
      </div>
      <div id="teacher-panels" class="teacher-panels"></div>
    </main>

    <!-- 导员详情页 -->
    <main id="page-counselor" class="page" hidden>
      <button id="btn-back-c" class="btn btn-ghost back-btn">← 返回学期</button>
      <div class="course-head">
        <h2 id="c-title"></h2>
        <p id="c-meta" class="course-meta"></p>
      </div>
      <div id="c-panels" class="teacher-panels"></div>
    </main>

    <footer class="app-footer">无穹书院 五字班 · 学生自发维护 · 仅校内参考</footer>
  </div>

  <!-- ========== 添加老师/导员弹窗 ========== -->
  <div id="modal-add-item" class="modal-mask" hidden>
    <div class="modal">
      <h3 id="add-item-title">添加老师</h3>
      <p id="add-item-desc" class="modal-desc"></p>
      <input type="text" id="new-item-name" placeholder="姓名" maxlength="30" />
      <input type="text" id="new-item-id" placeholder="课程编号（纯数字）" maxlength="12" hidden />
      <div class="modal-actions">
        <button id="btn-cancel-add" class="btn btn-ghost">取消</button>
        <button id="btn-confirm-add" class="btn btn-primary">添加</button>
      </div>
      <p id="add-item-msg" class="msg"></p>
    </div>
  </div>

  <!-- Supabase JS 库（本地副本，无需联网 CDN） -->
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
